<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>튜터_업무대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 디자인: 네오브루탈 — 크림 격자 배경 + 굵은 검정 테두리 + 오프셋 그림자 + 진녹색·연어색 포인트 */
:root{
  color-scheme:light;
  --bg:#F6F3EB; --grid:rgba(27,36,32,.055);
  --surface:#FFFFFF; --surface-2:#F0ECDF; --ink:#1B2420; --ink-2:#55635D; --muted:#76837C; --line:#DCD7C9;
  --brand:#3B6B5C; --brand-2:#DDE9E4; --on-brand:#FFFFFF;
  --accent:#EE9B8B; --accent-2:#FCE3DD;
  --tag-bg:#FFF1C9; --tag-ink:#4A3600;
  --ok:#2A7A52; --ok-bg:#DCEFE3; --warn:#9A6200; --warn-bg:#FBEFCB; --bad:#C0392B; --bad-bg:#FFE9E6;
  --info:#2D68AE; --info-bg:#E1ECF8; --lost:#7A5BA8; --lost-bg:#EEE7F7;
  --t1:#3B6B5C; --t2:#D4503F; --t3:#2D68AE; --t4:#A96F08; --t5:#7A5BA8; --t6:#1E8A9A; --t7:#A1527A; --t8:#6B7A3A;
  --sh:6px 6px 0 var(--ink); --sh-md:4px 4px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink); --sh-xs:2px 2px 0 var(--ink);
  --r-lg:20px; --r:14px;
  --f-sans:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default;box-shadow:none!important;transform:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
h1,h2,h3,h4{text-wrap:balance}

/* 틀 */
.wrap{max-width:1280px;margin:0 auto;padding-top:36px;padding-bottom:64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.site{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.logo{width:68px;height:68px;border-radius:18px;background:var(--brand-2);border:3px solid var(--ink);box-shadow:var(--sh-sm);display:grid;place-items:center;flex:none;color:var(--ink)}
.logo svg{width:34px;height:34px}
.sitettl{flex:1;min-width:0}
.site h1{margin:0;font-size:clamp(28px,4.2vw,46px);font-weight:900;letter-spacing:-.04em;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.hl{display:inline-block;background:var(--brand);color:var(--on-brand);border:3px solid var(--ink);border-radius:14px;padding:0 16px .06em;box-shadow:var(--sh-sm)}
.site p{margin:2px 0 0;color:var(--ink-2)}
.tools{display:flex;gap:12px;align-items:center}

.tabs{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px;padding:0 6px 8px 0}
.tabs a{display:inline-flex;align-items:center;gap:10px;padding:8px 20px 8px 9px;border:3px solid var(--ink);border-radius:18px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:800;font-size:16px;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.tabs a:hover{transform:translate(-1px,-1px);box-shadow:var(--sh-md)}
.tabs a:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tabs a.on{background:var(--brand);color:var(--on-brand)}
.tabs .num{width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--ink);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.tabs .cnt{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--accent);color:var(--ink);border:2px solid var(--ink);padding:0 7px;border-radius:99px;line-height:1.5}
.tabs .cnt.hot{background:var(--bad);color:#fff}

.main{min-width:0}
.top{margin-bottom:24px}
.badge{display:inline-block;background:var(--accent);border:3px solid var(--ink);border-radius:12px;padding:1px 14px;font-weight:900;font-size:14px;letter-spacing:.06em;box-shadow:var(--sh-xs)}
.top h2{font-size:clamp(28px,3.6vw,40px);font-weight:900;letter-spacing:-.04em;margin:14px 0 6px;line-height:1.25}
.top p{margin:0;color:var(--ink-2);max-width:780px;font-size:16px}
.foot{margin-top:44px;color:var(--ink-2);font-size:13px;text-align:center}
.foot b{color:var(--ink)}
.eyebrow{font-size:12.5px;letter-spacing:.04em;color:var(--muted);font-weight:800}

/* 기본 부품 */
.btn{display:inline-flex;align-items:center;gap:7px;border:2.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:var(--r);font-weight:800;line-height:1.2;white-space:nowrap;text-decoration:none;box-shadow:var(--sh-sm);transition:transform .1s,box-shadow .1s,background .1s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:var(--sh-md)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover:not(:disabled){box-shadow:var(--sh-xs);background:var(--surface)}
.btn.sm{padding:5px 12px;font-size:13px;border-width:2px;border-radius:11px;box-shadow:var(--sh-xs)}
.btn.sm:hover:not(:disabled){box-shadow:var(--sh-sm)}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm svg{width:14px;height:14px}
.icon-btn{width:46px;height:46px;justify-content:center;padding:0}
.card{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r-lg);padding:20px 22px;min-width:0;box-shadow:var(--sh)}
.cardhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cardhead h3{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em}
.lnk{color:var(--brand);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-size:13.5px}
.lnk:hover{color:var(--ink)}
.hint{color:var(--ink-2);font-size:13px;margin:8px 0 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:0 10px;border-radius:99px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);white-space:nowrap;line-height:1.6}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info);border-color:var(--info)}.chip.lost{background:var(--lost-bg);color:var(--lost);border-color:var(--lost)}
.tag{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--tag-ink);background:var(--tag-bg);border:1.5px solid var(--ink);border-radius:4px;padding:0 6px 0 14px;position:relative;white-space:nowrap;line-height:1.6}
.tag::before{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:7px;background:repeating-linear-gradient(90deg,var(--tag-ink) 0 1px,transparent 1px 2px,var(--tag-ink) 2px 2.6px,transparent 2.6px 4px);opacity:.75}
.tag.big{font-size:15px;padding:2px 10px 2px 22px}.tag.big::before{width:11px;left:6px}
.s-ok{--sc:var(--ok)}.s-warn{--sc:var(--warn)}.s-bad{--sc:var(--bad)}.s-lost{--sc:var(--lost)}.s-info{--sc:var(--info)}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2);border:2.5px dashed color-mix(in srgb,var(--ink) 55%,transparent);border-radius:var(--r-lg);background:var(--surface)}
.empty.sm{padding:18px 12px;font-size:13.5px;background:none;border-radius:14px}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-radius:16px;border:2.5px dashed var(--ink);background:var(--tag-bg);color:var(--tag-ink);margin-bottom:26px;font-size:14px;font-weight:500}
.sample .btn{margin-left:auto}
.subtabs{display:flex;gap:6px;background:var(--surface);border:3px solid var(--ink);padding:5px;border-radius:16px;width:fit-content;max-width:100%;overflow-x:auto;margin-bottom:22px;box-shadow:var(--sh-sm)}
.subtabs button{border:0;background:none;padding:7px 16px;border-radius:11px;font-weight:800;white-space:nowrap;color:var(--ink-2)}
.subtabs button:hover{background:var(--brand-2);color:var(--ink)}
.subtabs button.on{background:var(--brand);color:var(--on-brand)}

/* 목록 */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1.5px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .body{flex:1;min-width:0}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{font-size:12.5px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.stripe{width:6px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)}.stripe.warn{background:var(--t4)}
.age{font-size:12.5px;color:var(--ink-2);white-space:nowrap;font-weight:500}
.age.late{color:var(--bad);font-weight:800}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.xbtn{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.xbtn:hover{background:var(--bad-bg);color:var(--bad)}
.xbtn svg{width:16px;height:16px}

/* 오늘 */
.hello{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:center;margin-bottom:26px;padding:20px 24px;border-radius:var(--r-lg);background:var(--brand-2);border:3px solid var(--ink);box-shadow:var(--sh)}
.hello .eyebrow{color:var(--brand)}
.hello h2{margin:2px 0 0;font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.3}
.hello h2 .mono{font-size:30px}
.quick{display:flex;flex-wrap:wrap;gap:10px;flex:1;justify-content:flex-end}
.qchip{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);background:var(--surface);border-radius:99px;padding:6px 14px 6px 11px;font-weight:800;font-size:13.5px;box-shadow:var(--sh-xs);transition:transform .1s,box-shadow .1s}
.qchip i{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--ink)}
.qchip:hover{transform:translate(-1px,-1px);box-shadow:var(--sh-sm)}
.qchip:active{transform:translate(1px,1px);box-shadow:none}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:28px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:1/-1}
@media (max-width:1180px){.s4,.s5,.s7,.s8{grid-column:span 6}}
@media (max-width:860px){.g12>*{grid-column:1/-1}}
.tl{display:flex;flex-direction:column;gap:9px}
.tli{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--ink)}
.tli .p{font-family:var(--f-mono);font-weight:700;color:var(--brand);font-size:12.5px}
.tli.done{opacity:.6}
.tli.clash{background:var(--bad-bg);border-color:var(--bad)}
.conf{font-size:11.5px;color:var(--bad);font-weight:800}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:136px;height:136px;flex:none}
.dn-v{fill:var(--ink);font-family:var(--f-mono);font-weight:600;font-size:24px}
.dn-k{fill:var(--muted);font-size:11px;font-family:var(--f-sans)}
.leg{display:flex;flex-direction:column;gap:5px;font-size:13.5px;flex:1;min-width:120px;font-weight:500}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:11px;height:11px;border-radius:3px;background:var(--sc);border:2px solid var(--ink)}
.leg b{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);font-weight:700}
.kv b{font-size:20px}
.prog{display:grid;grid-template-columns:1fr auto;gap:8px 10px;width:100%;margin-top:14px;border:2.5px solid var(--ink);background:var(--surface-2);border-radius:14px;padding:11px 14px;text-align:left;box-shadow:var(--sh-xs);font-weight:700;transition:background .1s}
.prog:hover{background:var(--brand-2)}
.prog .bar{grid-column:1/-1;height:13px;border-radius:99px;background:var(--surface);border:2px solid var(--ink);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart text.now{fill:var(--brand);font-weight:700}
.chart text.v{fill:var(--ink-2);font-size:10.5px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart rect{stroke:var(--ink);stroke-width:1.2}
.tleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-top:8px;font-weight:500}
.tleg span{display:inline-flex;align-items:center;gap:6px}
.tleg i{width:11px;height:11px;border-radius:3px;border:2px solid var(--ink)}
.cyc{display:flex;flex-direction:column;gap:3px}
.cyc button{display:flex;gap:11px;align-items:flex-start;text-align:left;border:0;background:none;padding:8px 8px;border-radius:10px;font-weight:500}
.cyc button:hover{background:var(--brand-2)}
.cyc .box{width:21px;height:21px;border-radius:6px;border:2.5px solid var(--ink);background:var(--surface);flex:none;display:grid;place-items:center;margin-top:1px}
.cyc .box svg{width:14px;height:14px}
.cyc .on .box{background:var(--brand);color:var(--on-brand)}
.cyc .on>span:last-child{text-decoration:line-through;color:var(--muted)}

/* 빠른 접수 */
.inbox{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
@media (max-width:1040px){.inbox{grid-template-columns:1fr}}
.paste textarea{min-height:210px;font-size:14.5px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.recog{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.plist{display:flex;flex-direction:column;gap:20px}
.plhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plhead h3{margin:0;font-size:19px;font-weight:900}
.pcard{background:var(--surface);border:3px solid var(--ink);border-radius:18px;padding:16px 18px;border-left:10px solid var(--kc);box-shadow:var(--sh-md)}
.pcard[data-kind="ticket"]{--kc:var(--bad)}.pcard[data-kind="support"]{--kc:var(--t1)}.pcard[data-kind="account"]{--kc:var(--t4)}
.praw{font-size:14px;color:var(--ink-2);background:var(--surface-2);border:2px dashed color-mix(in srgb,var(--ink) 40%,transparent);border-radius:11px;padding:9px 12px;margin-bottom:12px}
.pdet{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.pdet .lab{font-size:12px;color:var(--muted);font-weight:800;margin-right:2px}
.pfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 12px;margin-top:12px}
.pfields .wide{grid-column:1/-1}
.pfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:6px}
.pfoot .hint{margin:0 auto 0 0}

/* 고장 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:22px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:var(--sh-sm)}
.stat .k{font-size:13px;color:var(--ink-2);font-weight:700}
.stat .v{font-size:30px;font-weight:700;font-family:var(--f-mono);letter-spacing:-.02em;line-height:1.25}
.stat .v small{font-size:13px;font-weight:700;color:var(--muted);font-family:var(--f-sans);margin-left:3px}
.stat.alert{background:var(--bad-bg)}
.stat.alert .v{color:var(--bad)}
.card .stat{box-shadow:var(--sh-xs)}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .hint{margin:0}
.kwrap{overflow-x:auto;padding:2px 8px 10px 2px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:18px}
.kcol{background:var(--surface-2);border:3px solid var(--ink);border-radius:var(--r-lg);padding:12px;min-height:240px;display:flex;flex-direction:column;gap:12px;transition:background .15s}
.kcol.over{background:var(--brand-2);border-style:dashed}
.khead{display:flex;align-items:center;gap:8px;padding:2px 4px 2px;font-weight:900;font-size:16px}
.khead i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink)}
.khead .n{font-family:var(--f-mono);font-size:12px;background:var(--surface);border:2px solid var(--ink);border-radius:99px;padding:0 9px;color:var(--ink);font-weight:600}
.kempty,.kmore{font-size:12.5px;color:var(--muted);text-align:center;padding:10px}
.tk{background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--sh-sm)}
.tk.late{box-shadow:inset 6px 0 0 var(--bad),var(--sh-sm)}
.tk.dragging{opacity:.4}
.tktop{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.tkroom{display:flex;gap:6px;align-items:center;font-weight:800;flex-wrap:wrap}
.tksym{font-size:13.5px;color:var(--ink-2)}
.tkmeta{display:flex;gap:5px;flex-wrap:wrap}
.tkact{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.tkact button{flex:1 1 auto;border:2px solid var(--ink);background:var(--surface);border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:800;white-space:nowrap}
.tkact button.go{background:var(--brand-2)}
.tkact button:hover{background:var(--accent-2)}

/* 수업 지원 */
.weekbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.weekbar strong{font-size:17px;margin:0 6px;font-family:var(--f-mono);font-weight:600}
.tt-wrap{overflow-x:auto;border:3px solid var(--ink);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh)}
.tt{width:100%;border-collapse:collapse;min-width:720px;table-layout:fixed}
.tt th,.tt td{border-top:1.5px solid var(--line);border-left:1.5px solid var(--line);vertical-align:top}
.tt thead th{border-top:0;border-bottom:3px solid var(--ink);padding:10px 12px;font-weight:900;text-align:left;background:var(--brand-2)}
.tt thead th small{display:block;font-family:var(--f-mono);font-weight:500;color:var(--ink-2);font-size:12px}
.tt thead th.today{background:var(--brand);color:var(--on-brand)}
.tt thead th.today small{color:var(--on-brand);opacity:.85}
.tt tbody th{width:68px;padding:10px 8px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);text-align:left;font-weight:600;background:var(--surface-2)}
.tt thead th:first-child{width:68px}
.tt th:first-child,.tt td:first-child{border-left:0}
.tt td{padding:5px;height:80px}
.tt td.today{background:color-mix(in srgb,var(--brand-2) 55%,transparent)}
.tt td.conflict{background:var(--bad-bg)}

function donut(c,total){
  const r=50,C=2*Math.PI*r;let off=0,s='';
  DEV_ST.forEach(st=>{const v=c[st]||0;if(!v||!total)return;const len=C*v/total;
    s+=`<circle cx="64" cy="64" r="${r}" fill="none" stroke-width="18" style="stroke:var(--${DEV_C[st]})" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 64 64)"><title>${st} ${v}대</title></circle>`;off+=len;});
  return `<svg viewBox="0 0 128 128" role="img" aria-label="기기 상태 비율"><circle cx="64" cy="64" r="${r}" fill="none" stroke-width="18" style="stroke:var(--surface-2)"/>${s}<text x="64" y="64" text-anchor="middle" class="dn-v">${total}</text><text x="64" y="82" text-anchor="middle" class="dn-k">보유 기기</text></svg>`;
}
function weekChart(ym){
  const first=ym+'-01',d0=parseYmd(first),last=ymd(new Date(d0.getFullYear(),d0.getMonth()+1,0)),weeks=[];
  for(let d=first;d<=last;d=addDays(d,1)){if(!isWeekday(d))continue;const w=mondayOf(d);let wk=weeks.find(x=>x.w===w);if(!wk){wk={w,from:d,to:d,by:{}};weeks.push(wk);}wk.to=d;}
  S.logs.forEach(l=>{if(l.date.slice(0,7)!==ym)return;const wk=weeks.find(x=>x.w===mondayOf(l.date));if(wk)wk.by[l.type]=(wk.by[l.type]||0)+l.min;});
  const tot=weeks.map(w=>sum(Object.values(w.by))),maxH=Math.max(1,Math.ceil(Math.max(60,...tot)/60));
  const step=maxH<=5?1:maxH<=10?2:maxH<=20?4:5,top=Math.ceil(maxH/step)*step;
  const W=560,H=220,pl=36,pr=8,pt=16,pb=38,cw=(W-pl-pr)/weeks.length,bw=Math.min(56,cw*.56);
  const y=v=>pt+(H-pt-pb)*(1-v/(top*60));let g='';
  for(let h=0;h<=top;h+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(h*60).toFixed(1)}" y2="${y(h*60).toFixed(1)}" class="gl"/><text x="${pl-6}" y="${(y(h*60)+4).toFixed(1)}" text-anchor="end">${h}h</text>`;
  weeks.forEach((wk,i)=>{const x=pl+cw*i+(cw-bw)/2;let acc=0;
    TYPES.forEach(t=>{const v=wk.by[t.k]||0;if(!v)return;const y1=y(acc+v),y0=y(acc);g+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y0-y1-1).toFixed(1)}" rx="2" style="fill:var(${t.c})"><title>${i+1}주 ${t.label} ${hm(v)}</title></rect>`;acc+=v;});
    const now=TODAY>=wk.from&&TODAY<=wk.to,f=parseYmd(wk.from);
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-20}" text-anchor="middle" class="${now?'now':''}">${i+1}주</text><text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" class="${now?'now':''}">${f.getMonth()+1}/${f.getDate()}~</text>`;
    if(acc)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y(acc)-5).toFixed(1)}" text-anchor="middle" class="v">${(acc/60).toFixed(1)}h</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="주별 활동 시간">${g}</svg>`;
}

function cleanLine(s){return s.replace(/^\s*(\[[^\]]*\]\s*)+/,'').replace(/^\s*(오전|오후)\s*\d{1,2}:\d{2}\s*/,'').trim();}
function parseLine(raw){
  const t=cleanLine(raw),lo=t.toLowerCase();let m,room='';
  m=t.match(/([1-6])\s*학년\s*(\d{1,2})\s*반/);if(m)room=`${m[1]}-${+m[2]}`;

  m=t.match(/(다음\s*주\s*)?([월화수목금])요일/);if(m){let d=addDays(addDays(mondayOf(TODAY),m[1]?7:0),'월화수목금'.indexOf(m[2]));if(!m[1]&&d<TODAY)d=addDays(d,7);date=d;}
  m=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);if(m)date=`${TODAY.slice(0,4)}-${pad(m[1])}-${pad(m[2])}`;

  const acc=/비밀번호|비번|패스워드/.test(t)?`학생 계정 비밀번호 초기화 ${count}건`:/발급|전입/.test(t)?`학생 계정 발급 ${count}건`:`계정 로그인 오류 처리 ${count}건`;
  let sym=t.split(/[.!?。]\s*|ㅠ+|ㅜ+/)[0].replace(/^\s*\d\s*학년\s*\d{1,2}\s*반\s*|^\s*\d-\d{1,2}\s*/,'').trim();if(sym.length>60)sym=sym.slice(0,58)+'…';
  return {id:uid(),raw:t,kind,room,no,cat:cat||'기타',sym,date:date||nextWeekday(TODAY),dateFound:!!date,period:period||1,periodFound:!!period,subj,content,urgent,count,acc};
}

function tableHTML(tb){return `<div class="ptable"><table><caption>${esc(tb.cap)}</caption><thead><tr>${tb.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map((r,i)=>`<tr class="${tb.total&&i===tb.rows.length-1?'tot':''}">${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function docToHTML(doc){
  let h=`<h2>${esc(doc.title)}</h2><div class="meta">${doc.meta.map(([k,v])=>`<span><b>${k}</b>${esc(v)}</span>`).join('')}</div>`;
  doc.sections.forEach((s,i)=>{h+=`<h4>${i+1}. ${esc(s.h)}</h4>`;let g=0;s.items.forEach(it=>{if(it.table)h+=tableHTML(it.table);else if(it.ga!=null)h+=`<div class="ga">${GA[g++]}. ${esc(it.ga)}</div>`;else h+=`<div class="dash">- ${esc(it.d)}</div>`;});});
  return h;
}
function docToText(doc){
  let o=`${doc.title}\n\n`+doc.meta.map(([k,v])=>`□ ${k}: ${v}`).join('   ')+'\n';
  doc.sections.forEach((s,i)=>{o+=`\n${i+1}. ${s.h}\n`;let g=0;s.items.forEach(it=>{if(it.table)o+=`\n  ${it.table.cap}\n`+[it.table.head].concat(it.table.rows).map(r=>'  '+r.join(' | ')).join('\n')+'\n\n';else if(it.ga!=null)o+=`  ${GA[g++]}. ${it.ga}\n`;else o+=`    - ${it.d}\n`;});});
  return o;
}
function docTables(doc){const out=[];doc.sections.forEach(s=>s.items.forEach(it=>{if(it.table)out.push(it.table.cap+'\n'+[it.table.head].concat(it.table.rows).map(r=>r.join('\t')).join('\n'));}));return out.join('\n\n');}
function dailyDoc(date){
  const L=S.logs.filter(l=>l.date===date),s1=[];
  TYPES.forEach(t=>{const a=L.filter(l=>l.type===t.k);if(!a.length)return;s1.push({ga:`${t.label}(${a.length}건, ${hm(sum(a.map(l=>l.min)))})`});a.forEach(l=>s1.push({d:`${l.room?l.room+' ':''}${l.note}`}));});
  if(!s1.length)s1.push({d:'기록된 활동 없음'});
  const cab=S.cab[date]||{},ck=Object.keys(cab),bad=ck.filter(r=>cab[r]==='이상');
  const created=S.tickets.filter(t=>t.created===date),done=S.tickets.filter(t=>t.done===date);
  const pend=S.tickets.filter(t=>t.created<=date&&(!t.done||t.done>date)),late=pend.filter(t=>daysBetween(t.created,date)>=7);
  const s2=[{ga:ck.length?`충전함 점검: ${ck.length}개 학급·장소 점검, 이상 ${bad.length}건${bad.length?`(${bad.join(', ')})`:''}`:'충전함 점검: 기록 없음'},{ga:`고장 접수 ${created.length}건, 처리 완료 ${done.length}건, 처리 중 ${pend.length}건(7일 이상 경과 ${late.length}건)`}];
  created.forEach(t=>s2.push({d:`[접수] ${t.room} ${t.dev?t.dev+' ':''}${t.sym}`}));done.forEach(t=>s2.push({d:`[완료] ${t.room} ${t.dev?t.dev+' ':''}${t.sym}`}));
  const nx=nextWeekday(addDays(date,1)),ns=S.supports.filter(s=>s.date===nx).sort((a,b)=>a.period-b.period);

function monthDoc(ym){

    const cnt={};x.logs.forEach(l=>cnt[l.note]=(cnt[l.note]||0)+1);Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([n,c])=>s3.push({d:`${n}${c>1?` (${c}회)`:''}`}));
    if(x.t.k==='support'){const rs=new Set(x.logs.map(l=>l.room).filter(Boolean));s3.push({d:`지원 학급·장소 ${rs.size}곳`});}});
  if(!s3.length)s3.push({d:'기록된 활동 없음'});
  const types=[...new Set(S.devices.map(d=>d.type))];
  const t2={cap:'<표 2> 기기 상태 현황(작성일 기준)',head:['구분'].concat(DEV_ST,['계']),rows:types.map(tp=>{const a=S.devices.filter(d=>d.type===tp);return [tp].concat(DEV_ST.map(st=>a.filter(d=>d.status===st).length),[a.length]);}).concat([['계'].concat(DEV_ST.map(st=>S.devices.filter(d=>d.status===st).length),[S.devices.length])]),total:true};
  const c=countBy(S.devices,'status'),rate=S.devices.length?pct((c['정상']||0)+(c['예비']||0),S.devices.length):0;
  const tc=S.tickets.filter(t=>t.created.slice(0,7)===ym),td=S.tickets.filter(t=>t.done&&t.done.slice(0,7)===ym);
  const avg=td.length?(sum(td.map(t=>daysBetween(t.created,t.done)))/td.length).toFixed(1):'-';
  const cc=countBy(tc,'cat'),open=S.tickets.filter(t=>t.status!=='완료'),late=open.filter(t=>daysBetween(t.created,TODAY)>=7).length;
  const cd=Object.keys(S.cab).filter(d=>d.slice(0,7)===ym),cbad=sum(cd.map(d=>Object.values(S.cab[d]).filter(v=>v==='이상').length));
  const s4=[{table:t2},{ga:`기기 가동률(정상·예비) ${rate}%`},{ga:`고장 접수 ${tc.length}건, 처리 완료 ${td.length}건(평균 처리 기간 ${avg}일)`}];
  if(tc.length)s4.push({d:'분류별 접수: '+Object.entries(cc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}건`).join(', ')});
  s4.push({d:`작성일 현재 처리 중 ${open.length}건(7일 이상 경과 ${late}건)`});

  const sp=S.supports.filter(s=>s.date.slice(0,7)===ym),g={};sp.forEach(s=>{const k=/^\d/.test(s.room)?s.room[0]+'학년':(s.room||'기타');g[k]=g[k]||[0,0];g[k][0]++;if(s.status==='완료')g[k][1]++;});

  const nm=m%12+1,s6=(CYCLE[nm]||[]).map(x=>({d:x}));

    sections:[{h:'활동 개요',items:s1},{h:'영역별 활동 실적',items:[{table:t1}]},{h:'주요 실적',items:s3},{h:'기기 관리 현황',items:s4},{h:'수업 지원 요청 현황',items:sp.length?[{table:t3}]:[{d:'수업 지원 요청 없음'}]},{h:`다음 달(${nm}월) 추진 계획`,items:s6}]};
}

  ledpage:a=>{led.page+=+a.dataset.d;$('#ledBox').innerHTML=ledgerTable();},
  ledcopy:()=>{const a=filteredDevices();copyText(['관리번호\t종류\t모델\t시리얼\t배정\t상태\t비고'].concat(a.map(d=>[d.id,d.type,d.model,d.serial,d.room,d.status,d.memo].join('\t'))).join('\n'),`${a.length}대를 복사했습니다. 엑셀 첫 칸에 붙여 넣어 주세요.`);},
  ledimp:()=>openModal(`<h3>엑셀 관리대장 붙여넣기</h3><p class="hint">엑셀이나 한셀에서 아래 순서의 열을 선택해 복사한 뒤 붙여 넣어 주세요. 첫 줄이 제목 행이어도 괜찮습니다.</p>
    <div class="colorder">${['관리번호','종류','모델','시리얼','배정','상태','비고'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>
    <textarea id="impText" rows="9" placeholder="T3-02-01	태블릿	10.9형 태블릿	R9TW40A7K3M	3-2	정상"></textarea>
    <label class="chk"><input type="checkbox" id="impReplace"> 기존 기기 목록을 지우고 새로 등록</label>
    <p class="hint">같은 관리번호가 있으면 새 내용으로 바뀝니다. 목록에 없는 학급은 설정에 자동으로 추가됩니다.</p>
    <div class="mfoot"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="impgo">등록하기</button></div>`),
  impgo:()=>{const lines=$('#impText').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let n=0;if($('#impReplace').checked)S.devices=[];const rs=rooms(),add=[];
    lines.forEach(line=>{const c=(line.includes('\t')?line.split('\t'):line.split(',')).map(x=>x.trim());if(!c[0]||/관리\s*번호/.test(c[0]))return;
      const d={id:c[0].toUpperCase(),type:c[1]||'태블릿',model:c[2]||'',serial:c[3]||'',room:c[4]||'',status:DEV_ST.includes(c[5])?c[5]:'정상',memo:c[6]||''};
      const i=S.devices.findIndex(x=>x.id===d.id);if(i>=0)S.devices[i]=d;else S.devices.push(d);n++;if(d.room&&!rs.includes(d.room)&&!add.includes(d.room))add.push(d.room);});
    if(add.length)S.settings.rooms=rs.concat(add).join(', ');save();closeModal();render(true);toast(n?`${n}대를 등록했습니다.`:'등록할 행을 찾지 못했습니다. 열 순서를 확인해 주세요.');},
  cab:a=>{const r=a.dataset.room,t=S.cab[TODAY]=S.cab[TODAY]||{};t[r]=!t[r]?'정상':t[r]==='정상'?'이상':undefined;if(!t[r])delete t[r];save();render(true);},
  caball:()=>{const t=S.cab[TODAY]=S.cab[TODAY]||{};rooms().forEach(r=>{if(!t[r])t[r]='정상';});save();render(true);},
  cablog:()=>{const t=S.cab[TODAY]||{},ks=Object.keys(t);if(!ks.length){toast('점검한 학급이 없습니다.');return;}const bad=ks.filter(r=>t[r]==='이상');
    const note=`충전함 정기 점검(${ks.length}개 학급·장소, 이상 ${bad.length}건${bad.length?': '+bad.join(', '):''})`;
    const ex=S.logs.find(l=>l.date===TODAY&&l.cab);if(ex){ex.note=note;ex.min=Math.max(10,ks.length*2);}else{addLog('check','',Math.max(10,ks.length*2),note);S.logs[S.logs.length-1].cab=true;}
    save();render(true);toast('점검 결과를 오늘 활동 기록에 남겼습니다.');},
  // 보고
  reptab:a=>{repTab=a.dataset.t;render(true);},
  copyDay:()=>copyText(docToText(dailyDoc(repDate)),'활동일지를 복사했습니다. 한글 문서에 붙여 넣어 주세요.'),
  copyMonth:()=>copyText(docToText(monthDoc(repMonth)),'월간 보고서를 복사했습니다. 한글 문서에 붙여 넣어 주세요.'),
  copyMonthTbl:()=>copyText(docTables(monthDoc(repMonth)),'표를 복사했습니다. 엑셀에 붙여 넣으면 칸이 나뉩니다.'),
  // 설정
  settings:()=>openModal(`<h3>설정</h3>
    <div class="row2"><div class="field"><label for="cSchool">학교 이름</label><input id="cSchool" value="${esc(S.settings.school)}"></div><div class="field"><label for="cTutor">작성자</label><input id="cTutor" value="${esc(S.settings.tutor)}"></div></div>
    <div class="field"><label for="cRooms">학급·장소 목록(쉼표로 구분)</label><textarea id="cRooms" rows="3">${esc(S.settings.rooms)}</textarea></div>
    <h4>백업과 옮기기</h4><p class="hint">기록은 지금 사용하는 브라우저에만 저장됩니다. 다른 컴퓨터로 옮기거나 다른 선생님께 전달할 때는 백업 코드를 복사해 메신저로 보내 주세요.</p>
    <div class="mfoot" style="justify-content:flex-start;margin-top:8px"><button class="btn sm" data-act="backup">${ICON.copy}백업 코드 복사</button><button class="btn sm" data-act="restoreShow">백업 코드로 복원</button></div>
    <div id="restoreBox"></div>
    <h4>초기화</h4><div class="mfoot" style="justify-content:flex-start;margin-top:8px">${S.sample?'<button class="btn sm danger" data-act="clearSample">예시 지우고 시작</button>':''}<button class="btn sm danger" data-act="reloadSample">예시 다시 불러오기</button></div>
    <div class="mfoot"><button class="btn" data-act="close">닫기</button><button class="btn primary" data-act="setsave">저장</button></div>`),
  setsave:()=>{S.settings.school=$('#cSchool').value.trim()||DEFAULT_SCHOOL;S.settings.tutor=$('#cTutor').value.trim()||'디지털튜터';S.settings.rooms=$('#cRooms').value.trim();save();closeModal();render(true);toast('설정을 저장했습니다.');},
  backup:()=>copyText(JSON.stringify(S),'백업 코드를 복사했습니다. 메모장이나 메신저에 붙여 보관해 주세요.'),
  restoreShow:()=>{$('#restoreBox').innerHTML=`<div class="field" style="margin-top:10px"><label for="restoreText">백업 코드</label><textarea id="restoreText" rows="4"></textarea></div><button class="btn sm primary" data-act="restoreGo">이 코드로 복원</button>`;},
  restoreGo:()=>{try{const o=JSON.parse($('#restoreText').value);if(!o||!Array.isArray(o.devices)||!o.settings)throw 0;S=o;save();closeModal();render();toast('백업을 복원했습니다.');}catch(e){toast('백업 코드를 읽지 못했습니다. 코드 전체를 붙여 넣어 주세요.');}},
  clearSample:()=>confirmBox('예시 기기와 기록을 모두 지우고 빈 상태로 시작합니다. 학급 목록은 남겨 두니 설정에서 우리 학교에 맞게 고쳐 주세요.','예시 지우기',()=>{S=blank(S.settings);save();render();ACT.settings();}),
  reloadSample:()=>confirmBox('지금까지의 기록을 모두 지우고 예시를 다시 불러옵니다. 필요하면 먼저 백업 코드를 복사해 주세요.','예시 불러오기',()=>{const sc=S.settings.school,tu=S.settings.tutor;S=makeSample();S.settings.school=sc;S.settings.tutor=tu;save();render();}),
  // 처음 열었을 때 학교 이름 받기
  welcome:()=>openModal(`<h3>학교 이름을 알려 주세요</h3>
    <p class="hint" style="margin:0 0 14px">입력한 이름은 화면 맨 위, 활동일지, 월간 실적 보고서에 그대로 들어갑니다. 설정에서 언제든 바꿀 수 있어요.</p>
    <div class="field"><label for="wSchool">학교 이름</label><input id="wSchool" placeholder="예) ○○초등학교, △△중학교, □□고등학교" autocomplete="off"></div>
    <div class="field"><label for="wTutor">작성자 이름 <small style="font-weight:500;color:var(--muted)">(선택, 일지 작성자란에 들어갑니다)</small></label><input id="wTutor" placeholder="예) 홍길동" autocomplete="off"></div>
    <p class="hint">학급·장소 목록은 설정에서 우리 학교에 맞게 바꿔 주세요. (예: 초등 1-1 ~ 6-4, 중·고등 1-1 ~ 3-8)</p>
    <div class="mfoot"><button class="btn" data-act="welcomeSkip">나중에</button><button class="btn primary" data-act="welcomeSave">시작하기</button></div>`),
  welcomeSave:()=>{const sc=$('#wSchool').value.trim();if(!sc){$('#wSchool').focus();toast('학교 이름을 입력해 주세요.');return;}
    S.settings.school=sc;const tu=$('#wTutor').value.trim();if(tu)S.settings.tutor=tu;save();closeModal();render(true);toast(`${sc} 대시보드로 시작합니다.`);},
  welcomeSkip:()=>{S.skipWelcome=true;save();closeModal();},
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(!f)return;if(a.tagName!=='A')e.preventDefault();f(a,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click();});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='inboxText')inboxText=el.value;
  else if(el.dataset&&el.dataset.pf){const p=parsed.find(x=>x.id===el.dataset.pid);if(p)p[el.dataset.pf]=el.dataset.pf==='urgent'?!!el.value:el.value;}
  else if(el.id==='ledQ'){led.q=el.value;led.page=0;$('#ledBox').innerHTML=ledgerTable();}
  else if(el.id==='qMin')document.querySelectorAll('#qMinSeg .segbtn').forEach(b=>b.classList.toggle('on',b.dataset.v===el.value));});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.pf){const p=parsed.find(x=>x.id===el.dataset.pid);if(p){p[el.dataset.pf]=el.dataset.pf==='urgent'?!!el.value:el.value;if(['room','no'].includes(el.dataset.pf))$('#parsedList').innerHTML=renderParsed();}}
  else if(el.id==='ledRoom'){led.room=el.value;led.page=0;$('#ledBox').innerHTML=ledgerTable();}
  else if(el.id==='ledSt'){led.st=el.value;led.page=0;$('#ledBox').innerHTML=ledgerTable();}
  else if(el.id==='repDate'){repDate=el.value||TODAY;render(true);}
  else if(el.id==='repMonth'){repMonth=el.value;render(true);}});
// 끌어 옮기기
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.tk');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.tid);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
document.addEventListener('dragend',()=>document.querySelectorAll('.dragging,.kcol.over').forEach(x=>x.classList.remove('dragging','over')));
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>{if(x!==col)x.classList.remove('over');});col.classList.add('over');});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col)return;e.preventDefault();const t=findT(e.dataTransfer.getData('text/plain'));if(t&&t.status!==col.dataset.st){setStatus(t,col.dataset.st);save();render(true);toast(`${t.no} ${col.dataset.st} 단계로 옮겼습니다.`);}});

function route(){const h=(location.hash||'').replace('#','');cur=VIEWS[h]?h:'today';render();}
window.addEventListener('hashchange',route);
$('#topQuick').innerHTML=ICON.plus+'<span class="lbl">기록 남기기</span>';
$('#topGear').innerHTML=ICON.gear;
load();save();route();
if(S.settings.school===DEFAULT_SCHOOL&&!S.skipWelcome)ACT.welcome();
})();
</script>

</body>
</html>
